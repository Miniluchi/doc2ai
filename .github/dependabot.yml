# Documentation des options :
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Dépendances backend (bun.lock)
  - package-ecosystem: "bun"
    directory: "/backend"
    schedule:
      interval: "weekly"

  # Dépendances frontend (bun.lock)
  - package-ecosystem: "bun"
    directory: "/frontend"
    schedule:
      interval: "weekly"

  # Images de base des Dockerfiles
  - package-ecosystem: "docker"
    directories:
      - "/backend"
      - "/frontend"
    schedule:
      interval: "weekly"

  # Actions GitHub utilisées dans les workflows CI
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
