services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    environment:
      - TZ=Europe/Paris
      - DATABASE_URL=file:/app/data/dev.db
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - PORT=3000
      - NODE_ENV=${NODE_ENV:-production}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:5173}
      - MICROSOFT_CLIENT_ID=${MICROSOFT_CLIENT_ID}
      - MICROSOFT_CLIENT_SECRET=${MICROSOFT_CLIENT_SECRET}
      - MICROSOFT_TENANT_ID=${MICROSOFT_TENANT_ID}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-http://localhost:3000/api/auth/google/callback}
      - REDIS_URL=${REDIS_URL}
      - STORAGE_PATH=/app/storage
      - TEMP_PATH=/app/temp
      - EXPORT_PATH=/app/exports
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - SYNC_INTERVAL_MINUTES=${SYNC_INTERVAL_MINUTES:-15}
      - EXTERNAL_PORT=${BACKEND_PORT}
    volumes:
      - backend_storage:/app/storage
      - backend_temp:/app/temp
      - backend_db:/app/data
      - ${EXPORT_PATH:-./exports}:/app/exports
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - doc2ai-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api
        - VITE_NODE_ENV=production
        - VITE_DEFAULT_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
        - VITE_DEFAULT_GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
        - VITE_DEFAULT_MICROSOFT_CLIENT_ID=${MICROSOFT_CLIENT_ID}
        - VITE_DEFAULT_MICROSOFT_CLIENT_SECRET=${MICROSOFT_CLIENT_SECRET}
        - VITE_DEFAULT_MICROSOFT_TENANT_ID=${MICROSOFT_TENANT_ID}
        - VITE_EXPORT_PATH=${EXPORT_PATH}
        - CONDUCTOR_WORKSPACE_NAME=${CONDUCTOR_WORKSPACE_NAME}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      - TZ=Europe/Paris
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - doc2ai-network

  # Optional supervision, disabled by default:
  #   docker compose --profile monitoring up -d
  # Deliberately without depends_on: the monitor must start and report the
  # backend as down, rather than wait for a backend that may never come up.
  uptime-kuma:
    image: louislam/uptime-kuma:2
    profiles: ["monitoring"]
    restart: unless-stopped
    # Bound to the loopback interface: the dashboard has its own account, but it
    # has no reason to be reachable from the local network by default.
    ports:
      - "127.0.0.1:${KUMA_PORT:-3001}:3001"
    environment:
      - TZ=Europe/Paris
    volumes:
      - kuma_data:/app/data
    networks:
      - doc2ai-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    environment:
      - TZ=Europe/Paris
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    volumes:
      - redis_data:/data
    networks:
      - doc2ai-network

volumes:
  backend_storage:
  backend_temp:
  backend_db:
  redis_data:
  kuma_data:

networks:
  doc2ai-network:
    driver: bridge
